<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3d2b1f">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — Maximos Signature</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/home.css">
  <link rel="stylesheet" href="/typography.css">
  <style>
    .not-found { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 3rem 1.5rem; text-align: center; }
    .not-found-content { width: 100%; max-width: 42rem; }
    .not-found .monogram { margin: 0 auto 3rem; color: var(--brown); }
    .not-found h1 { margin: 0; color: var(--brown); font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.2; }
    .not-found-message { margin: 1.5rem 0 2rem; color: var(--muted); }
    .not-found a:focus-visible { outline: 2px solid var(--brown); outline-offset: 5px; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-content">
      <a class="monogram" href="/" aria-label="Maximos Signature — página inicial"><span>M</span></a>
      <p class="section-label">Erro 404</p>
      <h1>Página não encontrada.</h1>
      <p class="not-found-message">O endereço que você procura não existe.</p>
      <a class="outline-button" href="/">Voltar à página inicial</a>
    </div>
  </main>
</body>
</html>
